- date: "December 2025"
  date_zh: "2025 年 12 月"
  title: "An interactive visualization of the Lidov-Kozai oscillation"
  title_zh: "古在–利多夫（Lidov–Kozai）振荡交互式可视化"
  link: "https://jiaxuanli.me/Lidov_Kozai/"

- date: "November 2025"
  date_zh: "2025 年 11 月"
  title: "A Possible 'Too-Many-Satellites' Problem in the Isolated Dwarf Galaxy DDO 161"
  title_zh: "孤立矮星系 DDO 161 中可能的“卫星星系过多”问题"
  description: "We report the most satellite-rich dwarf galaxy known to date, DDO 161, with a likelihood of 0.04% finding such a system in the TNG50 cosmological simulation. It challenges the current understanding of how low-mass galaxies populate dark matter halos in low-density environments."
  description_zh: "我们发现了迄今已知卫星星系最丰富的矮星系 DDO 161——在 TNG50 宇宙学模拟中出现此类系统的概率仅为 0.04%，对低密度环境下小质量暗物质晕中的星系形成提出了挑战。"
  link: "https://arxiv.org/abs/2511.01733"
  featured: true

- date: "May 2025"
  date_zh: "2025 年 5 月"
  title: "Discovery of 2017 OF201: A Potential Dwarf Planet"
  title_zh: "发现潜在矮行星 2017 OF201"
  description: "Together with <a href=\"https://sihaocheng.github.io/\">Sihao Cheng</a> (IAS) and <a href=\"https://eritasy.github.io/\">Eritas Yang</a> (Princeton), we discovered an exceptional trans-Neptunian object that challenges the Planet 9 hypothesis."
  description_zh: "与 <a href=\"https://sihaocheng.github.io/\">Sihao Cheng</a>（普林斯顿高等研究院）和 <a href=\"https://eritasy.github.io/\">Eritas Yang</a>（普林斯顿大学）合作，我们发现了一颗轨道极为宽扁的海王星外天体，对“第九行星”假说提出了新的限制。"
  link: "https://arxiv.org/abs/2505.15806"

- date: "January 2025"
  date_zh: "2025 年 1 月"
  title: "ELVES-Dwarf Survey: First Results Published"
  title_zh: "ELVES-Dwarf 巡天首批成果发表"
  description: "We present the first statistical characterization of satellite populations around isolated dwarf galaxies in the Local Volume."
  description_zh: "首次对近邻宇宙孤立矮星系周围的卫星星系族群给出了系统的统计刻画。"
  link: "https://ui.adsabs.harvard.edu/abs/2025arXiv250408030L/abstract"

- date: "November 2024"
  date_zh: "2024 年 11 月"
  title: "Hedgehog Discovery Featured in AAS Nova"
  title_zh: "孤立宁静矮星系 Hedgehog 的发现获 AAS Nova 专题报道"
  description: "Our discovery of an isolated quiescent dwarf galaxy at 2.4 Mpc is highlighted by AAS Nova."
  description_zh: "我们在距离 2.4 Mpc 处发现孤立宁静矮星系 Hedgehog 的工作入选美国天文学会 AAS Nova 研究亮点。"
  link: "https://aasnova.org/2024/11/06/discovery-of-a-lonely-galactic-hedgehog/"
