- date: "September 2026"
  date_zh: "2026 年 9 月"
  title: "The ELVES-Dwarf Survey Sample is Out!"
  title_zh: "ELVES-Dwarf 巡天完整样本正式发布！"
  description: "We release the full ELVES-Dwarf survey sample of satellite systems around isolated dwarf galaxies in the Local Volume. Explore the survey at <a href=\"https://elves-surveys.github.io/elves-dwarf/\">elves-surveys.github.io/elves-dwarf</a>."
  description_zh: "我们发布了本超星系团近邻宇宙（Local Volume）中孤立矮星系卫星系统的完整 ELVES-Dwarf 巡天样本，欢迎访问 <a href=\"https://elves-surveys.github.io/elves-dwarf/\">elves-surveys.github.io/elves-dwarf</a> 浏览数据。"
  link: "https://arxiv.org/abs/2609.00283"
  featured: true

- date: "August 2026"
  date_zh: "2026 年 8 月"
  title: "I joined Stanford University and KIPAC as a Brinson Prize Fellow."
  title_zh: "加入斯坦福大学与 KIPAC，担任 Brinson Prize Fellow。"
